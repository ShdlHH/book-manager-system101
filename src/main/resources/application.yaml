server:
  port: 8080

spring:
  application:
    name: Todo Management System
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/todo_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
    username: root       # 你的MySQL账号
    password: 123456     # 你的MySQL密码

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true  # 下划线转驼峰
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 打印SQL
  global-config:
    db-config:
      id-type: auto  # 主键自增
# 日志配置
logging:
  level:
    root: INFO  # 根日志级别
    com.todo.todomanagementsystem: DEBUG  # 项目包的日志级别设为DEBUG
    com.todo.todomanagementsystem.exception: DEBUG  # 异常处理包的日志级别
    com.baomidou.mybatisplus: DEBUG  # MyBatis Plus日志级别


jwt:
  secret: todoSystemJwtSecretKey1234567890abcdef                  # 修改密钥
  expire-time: 86400000             # 修改过期时间（毫秒）